          caption:

      let cursor = 0
      SHOTS.forEach((shot) => {
        shot.start = cursor
        cursor += shot.duration
        shot.end = cursor
      })

      const TAU = Math.PI * 2
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
      const lerp = (a, b, t) => a + (b - a) * t
      const ease = (t) => t * t * (3 - 2 * t)
      const pulse = (t, speed = 1) => (Math.sin(t * speed * TAU) + 1) / 2
      const fmt = (n) => String(n).padStart(2, '0')
      const rgba = (hex, alpha) => {
        const h = hex.replace('#', '')
        const r = parseInt(h.slice(0, 2), 16)
        const g = parseInt(h.slice(2, 4), 16)
        const b = parseInt(h.slice(4, 6), 16)
        return `rgba(${r},${g},${b},${alpha})`
      }

      function rr(x, y, w, h, r = 18) {
        const radius = Math.min(r, w / 2, h / 2)
        ctx.beginPath()
        ctx.moveTo(x + radius, y)
        ctx.arcTo(x + w, y, x + w, y + h, radius)
        ctx.arcTo(x + w, y + h, x, y + h, radius)
        ctx.arcTo(x, y + h, x, y, radius)
        ctx.arcTo(x, y, x + w, y, radius)
        ctx.closePath()
      }

      function fillPanel(x, y, w, h, fill = C.panel, stroke = C.line, radius = 22, alpha = 1) {
        ctx.save()
        ctx.globalAlpha = alpha
        rr(x, y, w, h, radius)
        ctx.fillStyle = fill
        ctx.fill()
        ctx.strokeStyle = stroke
        ctx.lineWidth = 2
        ctx.stroke()
        ctx.restore()
      }

      function line(x1, y1, x2, y2, color = C.line, width = 3, alpha = 1, dash = []) {
        ctx.save()
        ctx.globalAlpha = alpha
        ctx.strokeStyle = color
        ctx.lineWidth = width
        ctx.setLineDash(dash)
        ctx.beginPath()
        ctx.moveTo(x1, y1)
        ctx.lineTo(x2, y2)
        ctx.stroke()
        ctx.restore()
      }

      function tx(value, x, y, size = 32, color = C.ink, options = {}) {
        ctx.save()
        ctx.globalAlpha = options.alpha ?? 1
        ctx.font = `${options.weight || 400} ${size}px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif`
        ctx.fillStyle = color
        ctx.textAlign = options.align || 'left'
        ctx.textBaseline = options.baseline || 'alphabetic'
        ctx.fillText(String(value), x, y)
        ctx.restore()
      }

      function wrap(value, maxWidth, size = 32, weight = 400) {
        ctx.save()
        ctx.font = `${weight} ${size}px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif`
        const chars = Array.from(String(value))
        const lines = []
        let current = ''
        chars.forEach((ch) => {
          if (ch === '\n') {
            lines.push(current)
            current = ''
            return
          }
          const next = current + ch
          if (current && ctx.measureText(next).width > maxWidth) {
            lines.push(current)
            current = ch
          } else current = next
        })
        if (current) lines.push(current)
        ctx.restore()
        return lines
      }

      function paragraph(
        value,
        x,
        y,
        maxWidth,
        size = 32,
        color = C.muted,
        lineHeight = 48,
        options = {},
      ) {
        const lines = wrap(value, maxWidth, size, options.weight || 400)
        lines.forEach((v, i) => tx(v, x, y + i * lineHeight, size, color, options))
        return lines.length * lineHeight
      }

      function dot(x, y, r, color, alpha = 1, glow = 0) {
        ctx.save()
        ctx.globalAlpha = alpha
        if (glow) {
          ctx.shadowColor = color
          ctx.shadowBlur = glow
        }
        ctx.fillStyle = color
        ctx.beginPath()
        ctx.arc(x, y, r, 0, TAU)
        ctx.fill()
        ctx.restore()
      }

      function circle(x, y, r, stroke = C.line2, width = 3, alpha = 1) {
        ctx.save()
        ctx.globalAlpha = alpha
        ctx.strokeStyle = stroke
        ctx.lineWidth = width
        ctx.beginPath()
        ctx.arc(x, y, r, 0, TAU)
        ctx.stroke()
        ctx.restore()
      }

      function badge(value, x, y, color = C.cyan, width = null) {
        const w = width || Math.max(120, value.length * 25 + 48)
        fillPanel(x, y - 32, w, 56, rgba(color, 0.1), rgba(color, 0.55), 28)
        tx(value, x + w / 2, y + 6, 24, color, { align: 'center', weight: 600 })
        return w
      }

      function arrow(x1, y1, x2, y2, color = C.cyan, width = 4, alpha = 1, head = 15) {
        const angle = Math.atan2(y2 - y1, x2 - x1)
        line(x1, y1, x2, y2, color, width, alpha)
        ctx.save()
        ctx.globalAlpha = alpha
        ctx.fillStyle = color
        ctx.beginPath()
        ctx.moveTo(x2, y2)
        ctx.lineTo(
          x2 - Math.cos(angle - Math.PI / 6) * head,
          y2 - Math.sin(angle - Math.PI / 6) * head,
        )
        ctx.lineTo(
          x2 - Math.cos(angle + Math.PI / 6) * head,
          y2 - Math.sin(angle + Math.PI / 6) * head,
        )
        ctx.closePath()
        ctx.fill()
        ctx.restore()
      }

      function pathStroke(points, color, width = 4, alpha = 1, dash = []) {
        ctx.save()
        ctx.globalAlpha = alpha
        ctx.strokeStyle = color
        ctx.lineWidth = width
        ctx.setLineDash(dash)
        ctx.beginPath()
        points.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])))
        ctx.stroke()
        ctx.restore()
      }

      function particleOnSegment(x1, y1, x2, y2, t, color, size = 8, alpha = 1) {
        const p = ((t % 1) + 1) % 1
        dot(lerp(x1, x2, p), lerp(y1, y2, p), size, color, alpha, 15)
      }

      function particleOnPath(points, t, color, size = 8, alpha = 1) {
        const lengths = []
        let total = 0
        for (let i = 1; i < points.length; i++) {
          const len = Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1])
          lengths.push(len)
          total += len
        }
        let target = (((t % 1) + 1) % 1) * total
        for (let i = 0; i < lengths.length; i++) {
          if (target <= lengths[i]) {
            const p = target / lengths[i]
            particleOnSegment(
              points[i][0],
              points[i][1],
              points[i + 1][0],
              points[i + 1][1],
              p,
              color,
              size,
              alpha,
            )
            return
          }
          target -= lengths[i]
        }
      }

      function header(shot) {
        tx(shot.chapter.toUpperCase(), SAFE.left, 128, 25, C.cyan, { weight: 700 })
        tx(`${fmt(shot.n)} / ${SHOTS.length}`, SAFE.right, 128, 25, C.muted, {
          align: 'right',
          weight: 600,
        })
        line(SAFE.left, 160, SAFE.right, 160, C.line, 2, 0.85)
        tx(shot.title, SAFE.left, 282, 84, C.white, { weight: 700 })
        tx(shot.sub, SAFE.left, 360, 36, C.muted)
        badge(shot.label, SAFE.right - Math.max(170, shot.label.length * 26 + 55), 245, C.cyan)
      }

      function caption(shot, t) {
        ctx.save()
        ctx.fillStyle = rgba(C.bg, 0.9)
        ctx.fillRect(0, SAFE.captionTop - 22, W, SAFE.captionBottom - SAFE.captionTop + 35)
        ctx.restore()
        line(SAFE.left, SAFE.captionTop, SAFE.right, SAFE.captionTop, C.line2, 2, 0.9)
        tx('OPEN SCIENTIST  /  CORONAL HEATING', SAFE.left, SAFE.captionTop + 42, 22, C.faint, {
          weight: 700,
        })
        const max = 2640
        paragraph(shot.caption, SAFE.left, SAFE.captionTop + 86, max, 30, C.ink, 43)
        tx(
          `${Math.floor(t / 60)}:${fmt(Math.floor(t % 60))}`,
          SAFE.right,
          SAFE.captionTop + 44,
          24,
          C.faint,
          { align: 'right' },
        )
      }

      function drawBackground(t) {
        const grad = ctx.createLinearGradient(0, 0, 0, H)
        grad.addColorStop(0, C.bg2)
        grad.addColorStop(0.55, C.bg)
        grad.addColorStop(1, '#040b0e')
        ctx.fillStyle = grad
        ctx.fillRect(0, 0, W, H)

        ctx.save()
        ctx.globalAlpha = 0.16
        ctx.strokeStyle = C.line
        ctx.lineWidth = 1
        const drift = (t * 14) % 90
        for (let x = -90 + drift; x < W + 90; x += 90) {
          line(x, 0, x, H, C.line, 1, 0.35)
        }
        for (let y = 20; y < H; y += 90) {
          line(0, y, W, y, C.line, 1, 0.3)
        }
        ctx.restore()

        for (let i = 0; i < 42; i++) {
          const x = (i * 271 + 120) % W
          const y = 190 + ((i * 149) % 1430)
          const a = 0.1 + 0.08 * pulse(t * 0.15 + i * 0.07, 1)
          dot(x, y, i % 7 === 0 ? 3 : 2, i % 3 === 0 ? C.cyan : C.faint, a)
        }

        ctx.save()
        const scan = ((t * 110) % (H + 180)) - 90
        ctx.globalAlpha = 0.035
        ctx.fillStyle = C.cyan
        ctx.fillRect(0, scan, W, 4)
        ctx.restore()
      }

      function solar(x, y, r, t, scale = 1) {
        const halo = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.2)
        halo.addColorStop(0, rgba(C.orange, 0.28))
        halo.addColorStop(0.35, rgba(C.amber, 0.1))
        halo.addColorStop(1, rgba(C.orange, 0))
        ctx.fillStyle = halo
        ctx.beginPath()
        ctx.arc(x, y, r * 2.2, 0, TAU)
        ctx.fill()
        const g = ctx.createRadialGradient(x - r * 0.22, y - r * 0.28, r * 0.05, x, y, r)
        g.addColorStop(0, '#fff5c4')
        g.addColorStop(0.2, '#ffc37d')
        g.addColorStop(0.65, '#ec7e52')
        g.addColorStop(1, '#9a3b36')
        ctx.fillStyle = g
        ctx.beginPath()
        ctx.arc(x, y, r, 0, TAU)
        ctx.fill()
        ctx.save()
        ctx.globalAlpha = 0.36
        for (let i = 0; i < 18; i++) {
          const a = i * 1.91 + t * 0.08
          const rr0 = r * (0.32 + ((i * 37) % 48) / 100)
          dot(
            x + Math.cos(a) * rr0,
            y + Math.sin(a) * rr0,
            (i % 4) + 3,
            i % 2 ? C.yellow : C.orange,
            0.65,
          )
        }
        ctx.restore()

      function temperatureAxis(x, y, w, t) {
        line(x, y, x + w, y, C.line2, 3)

          line(x + w * p, y - 13, x + w * p, y + 13, C.line2, 2)

            align: 'center',
          })
        })
        const pts = []
        for (let i = 0; i <= 90; i++) {
          const p = i / 90
          const wave = Math.sin(p * 12 + t * 0.7) * 12
          const temp = p < 0.58 ? 0.18 + p * 0.22 : 0.31 + Math.pow((p - 0.58) / 0.42, 0.55) * 0.68
          pts.push([x + w * p, y - temp * 260 + wave])
        }

        const temp = p < 0.58 ? 0.18 + p * 0.22 : 0.31 + Math.pow((p - 0.58) / 0.42, 0.55) * 0.68
        dot(x + w * p, y - temp * 260 + Math.sin(p * 12 + t * 0.7) * 12, 11, C.white, 1, 22)
      }

      function wave(points, color, t, phase = 0, width = 5, alpha = 1) {
        const pts = []
        for (let i = 0; i <= 90; i++) {
          const p = i / 90
          const baseX = lerp(points[0][0], points[1][0], p)
          const baseY = lerp(points[0][1], points[1][1], p)
          pts.push([baseX, baseY + Math.sin(p * TAU * 3.4 - t * 4.2 + phase) * 16])
        }
        pathStroke(pts, color, width, alpha)
      }

      function miniChart(x, y, w, h, color, mode, t) {
        fillPanel(x, y, w, h, rgba(C.panel2, 0.72), C.line, 18)

        line(x + 42, y + 24, x + 42, y + h - 40, C.line2, 2)
        const pts = []
        for (let i = 0; i <= 70; i++) {
          const p = i / 70
          let v = 0.5
          if (mode === 'lag')
            v = 0.38 + 0.15 * Math.sin(p * 18) + 0.29 * Math.exp(-Math.pow((p - 0.64) * 11, 2))
          if (mode === 'wave')
            v = 0.45 + 0.2 * Math.sin(p * 29 - t * 1.8) + 0.06 * Math.sin(p * 61 + t)
          if (mode === 'confidence') v = 0.18 + 0.6 * p + 0.08 * Math.sin(p * 16 + t)
          if (mode === 'counter') v = 0.78 - 0.45 * p + 0.05 * Math.sin(p * 21 + t)
          pts.push([x + 42 + p * (w - 66), y + h - 40 - v * (h - 85)])
        }
        pathStroke(pts, color, 6, 0.95)

          width,

          rgba(color, 0.58),
          28,
          0.96,

          badge(v, xx, queueY + 86, [C.cyan, C.blue, C.purple, C.amber][i], 250)
          if (i < 3) arrow(xx + 270, queueY + 86, xx + 410, queueY + 86, C.line2, 3, 0.8)
          line(
            xx,
            queueY + 126,
            xx + p * 250,
            queueY + 126,
            [C.cyan, C.blue, C.purple, C.amber][i],
            4,
            0.72,
          )
        })
        tx('证据改变权重  →  下一轮任务改变  →  系统回到 Sisyphus', 1920, 1695, 35, C.yellow, {
          align: 'center',
          weight: 700,
        })
      }

      function drawDemoOutput(shot, t) {
        header(shot)
        const left = 240,
          top = 600
        fillPanel(left, top, 1740, 970, rgba(C.panel2, 0.9), C.line2, 24)
        tx('MHD CONFIG  /  AR13664-DEMO', left + 42, top + 62, 24, C.amber, { weight: 700 })
        const code = [
          ['region', 'AR13664'],
          ['heating.mode', 'coupled'],
          ['alfven.dissipation', 'scan(0.20, 0.70)'],
          ['reconnection.rate', 'scan(0.10, 0.60)'],
          ['observable', 'EUV → GOES lag'],
          ['uncertainty', 'E2 / E4 unresolved'],
        ]
        code.forEach((v, i) => {
          const yy = top + 145 + i * 104
          tx(v[0], left + 60, yy, 27, C.muted)
          tx(v[1], left + 630, yy, 30, i === 5 ? C.red : C.green, { weight: 600 })
          line(left + 60, yy + 30, left + 1630, yy + 30, C.line, 2)
        })
        badge('reproducible parameters', left + 60, top + 820, C.green, 340)
        badge('provenance attached', left + 450, top + 820, C.blue, 310)

        const right = 2130
        fillPanel(right, top, 1470, 970, rgba(C.panel, 0.94), C.line2, 24)
        tx('OBSERVATION PROPOSAL', right + 42, top + 62, 24, C.cyan, { weight: 700 })
        const tasks = [
          ['01', 'EUV / GOES lag', 'confidence interval', C.cyan],
          ['02', 'wave tracking', 'propagation speed', C.blue],
          ['03', 'MHD coupled scan', 'temperature response', C.purple],
          ['04', 'new observation', 'resolve E2 + E4', C.amber],
        ]
        tasks.forEach((v, i) => {
          const yy = top + 160 + i * 150
          dot(right + 65, yy, 19, v[3], 1, 18)
          tx(v[0], right + 65, yy + 8, 18, C.bg, { align: 'center', weight: 800 })
          tx(v[1], right + 115, yy - 3, 29, C.white, { weight: 700 })
          tx(v[2], right + 115, yy + 40, 24, C.muted)
          line(right + 115, yy + 78, right + 1320, yy + 78, C.line, 3)
          const p = (t * 0.22 + i * 0.17) % 1
          line(right + 115, yy + 78, right + 115 + p * 1205, yy + 78, v[3], 5)
        })
        line(right + 42, top + 790, right + 1425, top + 790, C.line2, 2)
        tx('answer boundary', right + 42, top + 850, 23, C.faint, { weight: 700 })
        tx('coupling is plausible; not yet proven', right + 42, top + 900, 30, C.yellow, {
          weight: 700,
        })
        tx('RUN-AR13664  /  output package ready', 1920, 1700, 30, C.green, {
          align: 'center',
          weight: 700,
        })
      }

      function drawClose(shot, t) {
        header(shot)
        const nodes = [
          { x: 520, label: 'OBSERVE', sub: 'real phenomenon', color: C.cyan },
          { x: 1340, label: 'ALIGN', sub: 'traceable evidence', color: C.blue },
          { x: 2160, label: 'REASON', sub: 'counterexample', color: C.purple },
          { x: 2980, label: 'ACT', sub: 'next experiment', color: C.amber },
        ]
        const y = 940
        const pts = nodes.map((n) => [n.x, y])
        pathStroke(pts, C.line2, 13, 0.65)
        particleOnPath(pts, t * 0.12, C.white, 13, 1)
        nodes.forEach((n, i) => {
          const dy = Math.sin(t * 1.3 + i * 0.8) * 10
          circle(n.x, y + dy, 108, n.color, 6, 0.85)
          dot(n.x, y + dy, 15, n.color, 1, 27)
          tx(n.label, n.x, y + 10 + dy, 27, C.white, { align: 'center', weight: 800 })
          tx(n.sub, n.x, y + 185, 27, C.muted, { align: 'center', weight: 600 })
        })
        line(2980, y + 110, 2980, y + 330, C.amber, 5, 0.72)
        line(2980, y + 330, 520, y + 330, C.amber, 5, 0.72)
        arrow(520, y + 330, 520, y + 120, C.amber, 5, 0.72)
        tx('每一次输出，都把新的问题带回起点', 1920, 1435, 40, C.yellow, {
          align: 'center',
          weight: 700,
        })
        const values = [
          ['多模态对齐', '把观测变成可计算对象', C.cyan],
          ['反例驱动', '让结论保持可修正', C.red],
          ['可执行输出', '让推理通向下一次实验', C.green],
        ]
        values.forEach((v, i) => {
          const x = 550 + i * 950
          fillPanel(x, 1530, 760, 180, rgba(v[2], 0.07), rgba(v[2], 0.42), 18)
          tx(v[0], x + 35, 1595, 29, v[2], { weight: 700 })
          tx(v[1], x + 35, 1650, 25, C.white, { weight: 600 })
        })
        tx('OPEN SCIENTIST', 1920, 1815, 32, C.cyan, { align: 'center', weight: 700 })
      }

      function drawShot(shot, t) {
        switch (shot.kind) {
          case 'mystery':
            return drawMystery(shot, t)
          case 'theory':
            return drawTheory(shot, t)
          case 'scientificFlow':
            return drawScientificFlow(shot, t)
          case 'workbench':
            return drawWorkbench(shot, t)
          case 'stages':
            return drawStages(shot, t)
          case 'agentMap':
            return drawAgentMap(shot, t)
          case 'sisyphus':
            return drawSisyphus(shot, t)
          case 'librarian':
            return drawLibrarian(shot, t)
          case 'looker':
            return drawLooker(shot, t)
          case 'explore':
            return drawExplore(shot, t)
          case 'oracle':
            return drawOracle(shot, t)
          case 'prometheus':
            return drawPrometheus(shot, t)
          case 'demoInput':
            return drawDemoInput(shot, t)
          case 'demoEvidence':
            return drawDemoEvidence(shot, t)
          case 'demoEvolution':
            return drawDemoEvolution(shot, t)
          case 'demoOutput':
            return drawDemoOutput(shot, t)
          case 'close':
            return drawClose(shot, t)
        }
      }

      function transitionDraw(previous, current, local) {
        const span = 0.92
        const p = ease(clamp(local / span))
        const kind = current.transition
        if (!previous || local >= span) {
          drawShot(current, local)
          return
        }

        if (kind === 'pan') {
          ctx.save()
          ctx.globalAlpha = 0.85
          ctx.translate(-220 * p, 0)
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.translate(520 * (1 - p), 0)
          drawShot(current, local)
          ctx.restore()
        } else if (kind === 'split') {
          ctx.save()
          ctx.globalAlpha = 0.72
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.beginPath()
          ctx.rect(0, 0, W * p, H)
          ctx.clip()
          drawShot(current, local)
          ctx.restore()
          line(W * p, 0, W * p, H, C.cyan, 5, 0.3)
        } else if (kind === 'route') {
          ctx.save()
          ctx.globalAlpha = 0.6
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.beginPath()
          ctx.rect(0, 0, W, H * p)
          ctx.clip()
          drawShot(current, local)
          ctx.restore()
          line(0, H * p, W, H * p, C.cyan, 4, 0.7)
        } else if (kind === 'growth') {
          ctx.save()
          ctx.globalAlpha = 0.52
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.translate(W / 2, H / 2)
          ctx.scale(0.93 + p * 0.07, 0.93 + p * 0.07)
          ctx.translate(-W / 2, -H / 2)
          drawShot(current, local)
          ctx.restore()
        } else if (kind === 'node-handoff' || kind === 'orbit') {
          ctx.save()
          ctx.globalAlpha = 0.48
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.globalAlpha = p
          ctx.translate(Math.sin(p * Math.PI) * 160, 0)
          drawShot(current, local)
          ctx.restore()
          particleOnSegment(1780, 480, 2060, 480, p, C.cyan, 10, 0.9)
        } else if (kind === 'scan') {
          ctx.save()
          ctx.globalAlpha = 0.45
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.beginPath()
          ctx.rect(W * p, 0, W * (1 - p), H)
          ctx.clip()
          drawShot(current, local)
          ctx.restore()
          line(W * p, 0, W * p, H, C.purple, 5, 0.68)
        } else if (kind === 'submit') {
          ctx.save()
          ctx.globalAlpha = 0.42
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.globalAlpha = p
          drawShot(current, local)
          ctx.restore()
          const bx = 1920 + Math.cos(p * Math.PI * 2) * 520
          const by = 1050 + Math.sin(p * Math.PI * 2) * 270
          dot(bx, by, 14, C.green, 1, 28)
        } else if (kind === 'export') {
          ctx.save()
          ctx.globalAlpha = 0.38
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.globalAlpha = p
          drawShot(current, local)
          ctx.restore()
          line(1400 + p * 1040, 480, 2440 + p * 1040, 480, C.amber, 4, 0.75)
        } else if (kind === 'pullback') {
          ctx.save()
          ctx.globalAlpha = 0.25
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.globalAlpha = p
          drawShot(current, local)
          ctx.restore()
          circle(1920, 1030, 160 + p * 240, C.cyan, 4, 0.34)
        } else {
          ctx.save()
          ctx.globalAlpha = 1 - p
          drawShot(previous, previous.duration)
          ctx.restore()
          ctx.save()
          ctx.globalAlpha = p
          drawShot(current, local)
          ctx.restore()
        }
      }

      function findShot(time) {
        const safeTime = clamp(time, 0, DURATION - 0.0001)
        return (
          SHOTS.find((shot) => safeTime >= shot.start && safeTime < shot.end) ||
          SHOTS[SHOTS.length - 1]
        )
      }

      function render(time = 0) {
        const currentTime = clamp(Number(time) || 0, 0, DURATION - 0.0001)
        const shot = findShot(currentTime)
        const local = currentTime - shot.start
        drawBackground(currentTime)
        const previous = shot.n > 1 ? SHOTS[shot.n - 2] : null
        transitionDraw(previous, shot, local)
        caption(shot, currentTime)
      }

      function resizeCanvas() {
        canvas.style.width = '100vw'
        canvas.style.height = '100vh'
      }

      function setRenderScale(scale) {
        renderScale = clamp(Number(scale) || 1, 0.25, 1)
        canvas.width = Math.round(W * renderScale)
        canvas.height = Math.round(H * renderScale)
        ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0)
      }

      window.__hfComposition = {
        id: 'root',
        width: W,
        height: H,
        fps: FPS,
        duration: DURATION,
        scenes: SHOTS.map(({ n, start, end, duration, kind, transition, label }) => ({
          n,
          start,
          end,
          duration,
          kind,
          transition,
          label,
        })),
      }
      window.__timelines = window.__timelines || {}
      window.__timelines.root = {
        width: W,
        height: H,
        fps: FPS,
        duration: DURATION,
        scenes: SHOTS,
        render,
      }
      window.__hfRender = render
      window.__hfSeek = (seconds) => {
        render(seconds)
        return seconds
      }
      window.__hfMetadata = { safeArea: SAFE, resolution: '3840x2160', fps: 60, duration: DURATION }

      resizeCanvas()
      window.addEventListener('resize', resizeCanvas)

      const params = new URLSearchParams(location.search)
      const queryTime = params.get('t')
      const staticMode = params.has('static')
      const recordMode = params.has('record')
      const recordSeconds = clamp(Number(params.get('recordSeconds')) || DURATION, 0.5, DURATION)
      let startWall = performance.now() - (Number(queryTime) || 0) * 1000
      function loop(now) {
        const seconds = staticMode ? Number(queryTime) || 0 : (now - startWall) / 1000
        render(seconds % DURATION)
        if (!staticMode) requestAnimationFrame(loop)
      }

      function recordCanvas(seconds) {
        if (!canvas.captureStream || !window.MediaRecorder) {
          document.title = 'OPEN_SCIENTIST_RECORDING_UNSUPPORTED'
          window.__hfRecordingStatus = 'unsupported'
          return
        }
        try {
          setRenderScale(params.get('recordScale') || 1)
          const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
          const mimeType = mimeCandidates.find((mime) => MediaRecorder.isTypeSupported(mime))
          const stream = canvas.captureStream(FPS)
          const recorder = new MediaRecorder(stream, {
            ...(mimeType ? { mimeType } : {}),
            videoBitsPerSecond: 24000000,
          })
          const chunks = []
          const uploadPort = params.get('uploadPort')
          let chunkIndex = 0
          let uploadQueue = Promise.resolve()
          window.__hfRecordingStatus = 'recording'
          recorder.ondataavailable = (event) => {
            if (!event.data || !event.data.size) return
            if (uploadPort) {
              const currentIndex = chunkIndex++
              uploadQueue = uploadQueue.then(async () => {
                const response = await fetch(
                  `http://127.0.0.1:${uploadPort}/chunk?index=${currentIndex}`,
                  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: event.data,
                  },
                )
                if (!response.ok) throw new Error(`chunk upload failed: ${response.status}`)
              })
            } else chunks.push(event.data)
          }
          recorder.onerror = (event) => {
            window.__hfRecordingStatus = `error:${event.error?.message || 'MediaRecorder error'}`
            document.title = 'OPEN_SCIENTIST_RECORDING_ERROR'
          }
          recorder.onstop = async () => {
            stream.getTracks().forEach((track) => track.stop())
            if (uploadPort) {
              try {
                window.__hfRecordingStatus = 'uploading'
                await uploadQueue
                const response = await fetch(`http://127.0.0.1:${uploadPort}/finish`, {
                  method: 'POST',
                })
                if (!response.ok) throw new Error(`finish upload failed: ${response.status}`)
                window.__hfRecordingStatus = `uploaded:${chunkIndex}`
                document.title = `OPEN_SCIENTIST_RECORDING_DONE:${chunkIndex}`
              } catch (error) {
                window.__hfRecordingStatus = `error:upload:${error.message}`
                document.title = 'OPEN_SCIENTIST_RECORDING_ERROR'
              }
            } else {
              const blob = new Blob(chunks, { type: mimeType || 'video/webm' })
              const link = document.createElement('a')
              link.href = URL.createObjectURL(blob)
              link.download = 'open-scientist-4k60.webm'
              link.style.display = 'none'
              document.body.appendChild(link)
              link.click()
              window.__hfRecordingStatus = `done:${blob.size}`
              document.title = `OPEN_SCIENTIST_RECORDING_DONE:${blob.size}`
            }
          }
          render(0)
          recorder.start(1000)
          const wallStart = performance.now()
          function recordLoop(now) {
            const elapsed = (now - wallStart) / 1000
            render(Math.min(elapsed, seconds - 0.0001))
            if (elapsed < seconds) requestAnimationFrame(recordLoop)
            else setTimeout(() => recorder.stop(), 900)
          }
          requestAnimationFrame(recordLoop)
        } catch (error) {
          window.__hfRecordingStatus = `error:${error.message}`
          document.title = 'OPEN_SCIENTIST_RECORDING_ERROR'
        }
      }

      window.__hfRecord = recordCanvas
      if (recordMode) {
        document.title = 'OPEN_SCIENTIST_RECORDING'
        setTimeout(() => recordCanvas(recordSeconds), 250)
      } else {
        requestAnimationFrame(loop)
      }
    </script>
  </body>
