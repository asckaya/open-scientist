<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>4K Test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        background: #040b13;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }
      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
      }
      #box {
        width: 400px;
        height: 400px;
        background: #6ce9df;
        margin: 340px auto;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080">
      <div id="box"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      tl.to('#box', { rotation: 360, scale: 1.5, duration: 2, ease: 'power2.inOut' })
      window.__timelines = { main: tl }
    </script>
  </body>
</html>
