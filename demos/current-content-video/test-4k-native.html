<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>4K Native Test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        width: 3840px;
        height: 2160px;
        background: #040b13;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }
      #root {
        width: 3840px;
        height: 2160px;
        position: relative;
      }
      #box {
        width: 800px;
        height: 800px;
        background: #6ce9df;
        margin: 680px auto;
        border-radius: 40px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="3840"
      data-height="2160"
      data-start="0"
      data-duration="2"
    >
      <div id="box"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      tl.to('#box', { rotation: 360, scale: 1.5, duration: 2, ease: 'power2.inOut' })
      window.__timelines = { main: tl }
    </script>
  </body>
</html>
